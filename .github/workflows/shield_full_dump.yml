name: Shield Full Dump

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full dump
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          SPREADSHEET_NAME:   ${{ secrets.SPREADSHEET_NAME }}
        run: python -c "from shield_parser import run_shield; run_shield(force_refresh=True, full=True)"

      - name: Upload raw dump (если парсинг упал)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-raw
          path: shield_dump_raw.txt
          if-no-files-found: ignore
